[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.ts", "*.mts", "*.js", "*.mjs", "*.json", "*.md", "*.yml", "*.yaml"]
excludes = ["references/**", "yarn.lock", "devenv.lock", "packages/core/src/generated/OpenResponses.ts", "packages/core/src/generated/OpenResponsesSchema.json"]

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]
excludes = ["references/**"]
